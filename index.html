<body>

  <section class="grey">
<div class="app">
  <div class="flag">
    <div class="stripe red"><span class="qazi-number"></span></div>
    <div class="stripe white"></div>
    <div class="stripe green"><span class="rojava">Rojava rojhelate kurdistan ek welate</span></div>

    <!-- SUN -->
    <div class="sun">
      <!-- 21 rays -->
      <div class="ray" style="--i:0"></div>
      <div class="ray" style="--i:1"></div>
      <div class="ray" style="--i:2"></div>
      <div class="ray" style="--i:3"></div>
      <div class="ray" style="--i:4"></div>
      <div class="ray" style="--i:5"></div>
      <div class="ray" style="--i:6"></div>
      <div class="ray" style="--i:7"></div>
      <div class="ray" style="--i:8"></div>
      <div class="ray" style="--i:9"></div>
      <div class="ray" style="--i:10"></div>
      <div class="ray" style="--i:11"></div>
      <div class="ray" style="--i:12"></div>
      <div class="ray" style="--i:13"></div>
      <div class="ray" style="--i:14"></div>
      <div class="ray" style="--i:15"></div>
      <div class="ray" style="--i:16"></div>
      <div class="ray" style="--i:17"></div>
      <div class="ray" style="--i:18"></div>
      <div class="ray" style="--i:19"></div>
      <div class="ray" style="--i:20"></div>

      <div class="sun-core"></div>
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="anthem" src="kurdistan-song.mp4"></audio>

  <button class="music-btn" onclick="toggleMusic()">
    <span class="icon">🎵</span>
    <span id="btnText">KURDISTAN</span>
  </button>

</section>

<section class="section whitee"> 
  <p class="quotes1">بۆ خودا سوجدە دەبەین و بۆ دین دەژین  لە پێناو خاکیش دەمرین و 
بۆ کەسیش ناچەمێینەوە  ، چوار پارچەین بە خاک بەڵآم یەک نەتەوەین بە ئیمان و شکۆ </p>
